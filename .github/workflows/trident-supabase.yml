name: Trident Supabase Deploy Gate

on:
  workflow_dispatch:
    inputs:
      apply_schema:
        description: "Apply additive Supabase SQL migrations when SUPABASE_DB_URL is configured"
        required: true
        type: boolean
        default: false
      run_trident_etl:
        description: "Run Trident ETL after schema validation when CSV provider env is configured"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "backend/sql/**"
      - "backend/trident_screener.py"
      - "backend/historical_prices_sync.py"
      - "backend/supabase_key_guard.py"
      - "backend/scripts/run_data_refresh.py"
      - "backend/scripts/update_target_allocations.py"
      - "backend/scripts/sync_trident_screener.py"
      - "backend/tests/test_trident_screener.py"
      - "backend/tests/test_refresh_ops.py"
      - "backend/tools/schema_check.py"
      - "frontend/app/trident/**"
      - "frontend/lib/tridentData.ts"
      - "frontend/types.ts"
      - "frontend/scripts/smoke-supabase.mjs"
      - ".github/workflows/trident-supabase.yml"
      - ".github/workflows/schedule.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend tests
        working-directory: ./backend
        run: python3.11 -m pytest -q

      - name: Backend compile check
        working-directory: ./backend
        run: python3.11 -m py_compile bridge.py technical_state.py etl_stats.py historical_prices_sync.py trident_screener.py scripts/run_data_refresh.py scripts/update_target_allocations.py scripts/sync_trident_screener.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

  supabase-gate:
    runs-on: ubuntu-latest
    needs: validate
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL_VAR: ${{ vars.SUPABASE_DB_URL }}
      DATABASE_URL_VAR: ${{ vars.DATABASE_URL }}
      APPLY_SCHEMA: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_schema || false }}
      RUN_TRIDENT_ETL: ${{ github.event_name == 'workflow_dispatch' && inputs.run_trident_etl || false }}
      TRIDENT_PROVIDER: ${{ vars.TRIDENT_PROVIDER || 'global_yahoo' }}
      TRIDENT_INDEXES: ${{ vars.TRIDENT_INDEXES }}
      TRIDENT_LIMIT: ${{ vars.TRIDENT_LIMIT }}
      TRIDENT_PER_INDEX_LIMIT: ${{ vars.TRIDENT_PER_INDEX_LIMIT }}
      TRIDENT_YAHOO_SLEEP_SEC: ${{ vars.TRIDENT_YAHOO_SLEEP_SEC || '0.15' }}
      TRIDENT_UNIVERSE_CSV: ${{ vars.TRIDENT_UNIVERSE_CSV }}
      TRIDENT_FINANCIALS_CSV: ${{ vars.TRIDENT_FINANCIALS_CSV }}
      TRIDENT_SOURCE_LICENSE_NOTE: ${{ vars.TRIDENT_SOURCE_LICENSE_NOTE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-migration schema check
        working-directory: ./backend
        continue-on-error: true
        run: python tools/schema_check.py --pretty --output schema-check-before.json

      - name: Apply additive Supabase migrations
        if: ${{ env.APPLY_SCHEMA == 'true' }}
        env:
          PGPASSWORD: ""
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            SUPABASE_DB_URL="$DATABASE_URL"
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            SUPABASE_DB_URL="$SUPABASE_DB_URL_VAR"
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            SUPABASE_DB_URL="$DATABASE_URL_VAR"
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL or DATABASE_URL is required as a GitHub Actions secret or variable to apply SQL migrations."
            echo "SUPABASE_URL + SUPABASE_SERVICE_KEY can validate REST schema and write rows, but cannot run DDL SQL."
            exit 2
          fi
          echo "::add-mask::$SUPABASE_DB_URL"
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -f backend/sql/20260210_market_watch_phase2_technicals.sql \
            -f backend/sql/20260222_historical_prices.sql \
            -f backend/sql/20260524_historical_price_local_columns.sql \
            -f backend/sql/20260222_backtest_model.sql \
            -f backend/sql/20260222_backtest_common_start.sql \
            -f backend/sql/20260222_backtest_portfolio_key_relax.sql \
            -f backend/sql/20260222_backtest_config_hash_idx.sql \
            -f backend/sql/20260524_trident_screener.sql

      - name: Post-migration schema check
        working-directory: ./backend
        run: python tools/schema_check.py --pretty --output schema-check-after.json

      - name: Run Trident ETL when configured
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_trident_etl }}
        working-directory: ./backend
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$TRIDENT_PROVIDER" = "csv" ] && { [ -z "$TRIDENT_UNIVERSE_CSV" ] || [ -z "$TRIDENT_FINANCIALS_CSV" ]; }; then
            echo "::error::TRIDENT_UNIVERSE_CSV and TRIDENT_FINANCIALS_CSV repository variables are required for CSV provider."
            exit 2
          fi
          cmd=(python scripts/sync_trident_screener.py)
          if [ -n "$TRIDENT_LIMIT" ]; then
            cmd+=(--limit "$TRIDENT_LIMIT")
          fi
          if [ -n "$TRIDENT_PER_INDEX_LIMIT" ]; then
            cmd+=(--per-index-limit "$TRIDENT_PER_INDEX_LIMIT")
          fi
          "${cmd[@]}"

      - name: Setup Node for Supabase smoke
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Supabase smoke with anon read key
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase smoke requires SUPABASE_URL and SUPABASE_ANON_KEY."
            exit 2
          fi
          npm run smoke:supabase -- --output=smoke-supabase-report.json

      - name: Upload Supabase reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trident-supabase-reports
          path: |
            backend/schema-check-before.json
            backend/schema-check-after.json
            frontend/smoke-supabase-report.json
          if-no-files-found: warn
