name: Trident Stock Insights Sync

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "Top Trident scored rows to refresh when ticker is empty"
        required: true
        type: string
        default: "200"
      ticker:
        description: "Optional ticker/provider_symbol to refresh on demand"
        required: false
        type: string
      force:
        description: "Refresh even when the current insight is fresh"
        required: true
        type: boolean
        default: false
      dry_run:
        description: "Build insight payloads without writing rows"
        required: true
        type: boolean
        default: true
      authorization_manifest:
        description: "Canonical JSON authorization required only when dry_run=false"
        required: false
        type: string
      authorization_manifest_sha256:
        description: "SHA-256 of the canonical authorization manifest"
        required: false
        type: string
      authorization_signature:
        description: "HMAC-SHA256 signature required only when dry_run=false"
        required: false
        type: string
      authorization_nonce:
        description: "One-shot lowercase hexadecimal authorization nonce"
        required: false
        type: string
      authorization_receipt_id:
        description: "One-shot authorization receipt identifier"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-production-mutation
  cancel-in-progress: false

jobs:
  prepare-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build untrusted dependency artifact without secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target "$RUNNER_TEMP/python-deps" wheel scipy==1.15.1 statsmodels==0.14.4 -r backend/requirements.txt
      - name: Upload prepared Python dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stock-insights-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps
          if-no-files-found: error
          retention-days: 1

  sync-insights:
    runs-on: ubuntu-latest
    needs: prepare-runtime
    timeout-minutes: 120
    environment: Production

    env:
      AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
      AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
      PYTHONPATH: ${{ runner.temp }}/python-deps
      MUTATION_GATE: ${{ vars.ASTROCYTE_MUTATION_GATE }}
      SOURCE_RIGHTS_GATE: ${{ vars.ASTROCYTE_SOURCE_RIGHTS_GATE }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      YFINANCE_PROFILE_TIMEOUT_SEC: ${{ vars.YFINANCE_PROFILE_TIMEOUT_SEC || '30' }}
      TRIDENT_STOCK_INSIGHTS_BATCH_SIZE: ${{ vars.TRIDENT_STOCK_INSIGHTS_BATCH_SIZE || '25' }}
      TOP_N: ${{ inputs.top_n }}
      TICKER: ${{ inputs.ticker }}
      FORCE: ${{ inputs.force }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Trusted verifier digest is invalid."
            exit 2
          fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Claim one-shot mutation authorization
        env:
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow trident-stock-insights \
            --replay-phase claim \
            --marker-file "$RUNNER_TEMP/mutation-replay-marker.json" \
            --input "top_n=$TOP_N" \
            --input "ticker=$TICKER" \
            --input "force=$FORCE" \
            --input "dry_run=$DRY_RUN"

      - name: Persist one-shot anti-replay marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-replay-${{ inputs.authorization_receipt_id }}-${{ inputs.authorization_nonce }}
          path: ${{ runner.temp }}/mutation-replay-marker.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then
            echo "::error::Trusted verifier changed during dependency setup."
            exit 2
          fi

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow trident-stock-insights \
            --replay-phase enforce \
            --input "top_n=$TOP_N" \
            --input "ticker=$TICKER" \
            --input "force=$FORCE" \
            --input "dry_run=$DRY_RUN"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stock-insights-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Apply provider kill switches and verify required configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$SOURCE_RIGHTS_GATE" != "APPROVED" ]; then
            echo "::error::Stock insights sync is disabled until ASTROCYTE_SOURCE_RIGHTS_GATE is APPROVED."
            exit 2
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$MUTATION_GATE" != "APPROVED" ]; then
            echo "::error::ASTROCYTE_MUTATION_GATE kill switch is closed."
            exit 2
          fi
          missing=()
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY TOP_N; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required configuration: %s\n' "${missing[*]}"
            exit 2
          fi
          if ! [[ "$TOP_N" =~ ^[0-9]+$ ]] || [ "$TOP_N" -lt 1 ]; then
            echo "::error::top_n must be a positive integer."
            exit 2
          fi

      - name: Preflight schema check
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/schema_check.py --pretty --output schema-check-before-insights.json

      - name: Sync Trident stock insights
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cmd=(
            python scripts/sync_trident_stock_insights.py
            --top-n "$TOP_N"
            --batch-size "$TRIDENT_STOCK_INSIGHTS_BATCH_SIZE"
            --output trident-stock-insights-sync.json
          )
          if [ -n "$TICKER" ]; then
            cmd+=(--ticker "$TICKER")
          fi
          if [ "$FORCE" = "true" ]; then
            cmd+=(--force)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            cmd+=(--dry-run)
          fi
          "${cmd[@]}"

      - name: Sync open equity screener read model
        if: ${{ env.DRY_RUN != 'true' }}
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/sync_equity_screener.py --enforce-quality-gate --output equity-screener-sync.json

      - name: Upload insight reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trident-stock-insights-reports
          path: |
            backend/schema-check-before-insights.json
            backend/trident-stock-insights-sync.json
            backend/equity-screener-sync.json
          if-no-files-found: warn
