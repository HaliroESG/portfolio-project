name: Production App Smoke

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production Vercel URL to validate"
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PRODUCTION_APP_URL: ${{ inputs.production_url || vars.PRODUCTION_APP_URL }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required configuration
        run: |
          missing=()
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY PRODUCTION_APP_URL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required configuration: %s\n' "${missing[*]}"
            exit 2
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        working-directory: ./frontend
        run: npm run smoke:production -- --output=production-smoke-report.json

      - name: Upload production smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-app-smoke-reports
          path: |
            frontend/production-smoke-report.json
            frontend/smoke-supabase-production-report.json
          if-no-files-found: warn
