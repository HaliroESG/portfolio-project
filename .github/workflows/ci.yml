name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-contract-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python for offline financial parity
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Run contract check
        working-directory: ./frontend
        run: npm run contract-check

      - name: Validate financial qualification and critical flows offline
        working-directory: ./frontend
        run: |
          npm run test:financial-qualification
          npm run test:critical-flows-family-office
          node scripts/validate-critical-flows.mjs

      - name: Install Chromium for offline page regressions
        working-directory: ./frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Run offline real-SWR page regressions
        working-directory: ./frontend
        run: npm run test:source-state:browser
