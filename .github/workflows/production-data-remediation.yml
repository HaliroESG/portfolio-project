name: Production Data Remediation

on:
  workflow_dispatch:
    inputs:
      apply_schema:
        description: "Apply additive Supabase SQL migrations"
        required: true
        type: boolean
        default: false
      top_n:
        description: "Top Trident scored rows to backfill first"
        required: true
        type: string
        default: "200"
      start_date:
        description: "Historical price start date"
        required: true
        type: string
        default: "1999-01-01"
      run_full_after_top:
        description: "Run full Trident sync after top-score backfill"
        required: true
        type: boolean
        default: false
      authorization_manifest:
        description: "Canonical JSON authorization bound to main, SHA, inputs, controller and restore receipt"
        required: true
        type: string
      authorization_manifest_sha256:
        description: "SHA-256 of the canonical authorization manifest"
        required: true
        type: string
      authorization_signature:
        description: "HMAC-SHA256 signature issued independently of the dispatcher"
        required: true
        type: string
      authorization_nonce:
        description: "One-shot lowercase hexadecimal authorization nonce"
        required: true
        type: string
      authorization_receipt_id:
        description: "One-shot authorization receipt identifier"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: portfolio-production-mutation
  cancel-in-progress: false

jobs:
  prepare-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build untrusted dependency artifact without secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target "$RUNNER_TEMP/python-deps" wheel scipy==1.15.1 statsmodels==0.14.4 -r backend/requirements.txt
      - name: Upload prepared Python dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remediation-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps
          if-no-files-found: error
          retention-days: 1

  remediate-data:
    runs-on: ubuntu-latest
    needs: prepare-runtime
    timeout-minutes: 360
    environment: Production

    env:
      AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
      AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
      PYTHONPATH: ${{ runner.temp }}/python-deps
      MUTATION_GATE: ${{ vars.ASTROCYTE_MUTATION_GATE }}
      SOURCE_RIGHTS_GATE: ${{ vars.ASTROCYTE_SOURCE_RIGHTS_GATE }}
      TRIDENT_PROVIDER: ${{ vars.TRIDENT_PROVIDER || 'global_yahoo' }}
      TRIDENT_INDEXES: ${{ vars.TRIDENT_INDEXES }}
      TRIDENT_LIMIT: ${{ vars.TRIDENT_LIMIT }}
      TRIDENT_PER_INDEX_LIMIT: ${{ vars.TRIDENT_PER_INDEX_LIMIT }}
      TRIDENT_YAHOO_SLEEP_SEC: ${{ vars.TRIDENT_YAHOO_SLEEP_SEC || '0.15' }}
      TRIDENT_UNIVERSE_CSV: ${{ vars.TRIDENT_UNIVERSE_CSV }}
      TRIDENT_FINANCIALS_CSV: ${{ vars.TRIDENT_FINANCIALS_CSV }}
      TRIDENT_SOURCE_LICENSE_NOTE: ${{ vars.TRIDENT_SOURCE_LICENSE_NOTE }}
      YFINANCE_DOWNLOAD_TIMEOUT_SEC: ${{ vars.YFINANCE_DOWNLOAD_TIMEOUT_SEC || '30' }}
      YFINANCE_PROFILE_TIMEOUT_SEC: ${{ vars.YFINANCE_PROFILE_TIMEOUT_SEC || '30' }}
      TRIDENT_STOCK_INSIGHTS_BATCH_SIZE: ${{ vars.TRIDENT_STOCK_INSIGHTS_BATCH_SIZE || '25' }}
      TOP_N: ${{ github.event_name == 'workflow_dispatch' && inputs.top_n || '200' }}
      START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || '1999-01-01' }}
      APPLY_SCHEMA: ${{ inputs.apply_schema }}
      RUN_FULL_AFTER_TOP: ${{ inputs.run_full_after_top }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Trusted verifier digest is invalid."
            exit 2
          fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Claim one-shot mutation authorization
        env:
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow production-data-remediation \
            --replay-phase claim \
            --marker-file "$RUNNER_TEMP/mutation-replay-marker.json" \
            --input "apply_schema=$APPLY_SCHEMA" \
            --input "top_n=$TOP_N" \
            --input "start_date=$START_DATE" \
            --input "run_full_after_top=$RUN_FULL_AFTER_TOP"

      - name: Persist one-shot anti-replay marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-replay-${{ inputs.authorization_receipt_id }}-${{ inputs.authorization_nonce }}
          path: ${{ runner.temp }}/mutation-replay-marker.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then
            echo "::error::Trusted verifier changed during dependency setup."
            exit 2
          fi

      - name: Validate one-shot authorization before dependency download
        env:
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow production-data-remediation \
            --replay-phase enforce \
            --input "apply_schema=$APPLY_SCHEMA" \
            --input "top_n=$TOP_N" \
            --input "start_date=$START_DATE" \
            --input "run_full_after_top=$RUN_FULL_AFTER_TOP"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: remediation-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow production-data-remediation \
            --replay-phase enforce \
            --input "apply_schema=$APPLY_SCHEMA" \
            --input "top_n=$TOP_N" \
            --input "start_date=$START_DATE" \
            --input "run_full_after_top=$RUN_FULL_AFTER_TOP"

      - name: Apply provider kill switches and verify required configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$MUTATION_GATE" != "APPROVED" ] || [ "$SOURCE_RIGHTS_GATE" != "APPROVED" ]; then
            echo "::error::Production remediation is disabled until mutation and source-rights gates are separately approved."
            exit 2
          fi
          missing=()
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY TOP_N START_DATE; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required configuration: %s\n' "${missing[*]}"
            exit 2
          fi
          if ! [[ "$TOP_N" =~ ^[0-9]+$ ]] || [ "$TOP_N" -lt 1 ]; then
            echo "::error::top_n must be a positive integer."
            exit 2
          fi

      - name: Pre-migration schema check
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/schema_check.py --pretty --output schema-check-before-remediation.json

      - name: Apply additive Supabase migrations
        if: ${{ env.APPLY_SCHEMA == 'true' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGPASSWORD: ""
        run: |
          db_url="$SUPABASE_DB_URL"
          if [ -z "$db_url" ]; then
            db_url="$DATABASE_URL"
          fi
          if [ -z "$db_url" ]; then
            echo "::error::SUPABASE_DB_URL or DATABASE_URL is required as a Production secret to apply SQL migrations."
            exit 2
          fi
          echo "::add-mask::$db_url"
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$db_url" \
            -v ON_ERROR_STOP=1 \
            --single-transaction \
            -f backend/sql/20260210_market_watch_phase2_technicals.sql \
            -f backend/sql/20260210_portfolio_positions_phase3.sql \
            -f backend/sql/20260213_isin_identifier_map.sql \
            -f backend/sql/20260222_historical_prices.sql \
            -f backend/sql/20260524_historical_price_local_columns.sql \
            -f backend/sql/20260222_backtest_model.sql \
            -f backend/sql/20260222_backtest_common_start.sql \
            -f backend/sql/20260222_backtest_portfolio_key_relax.sql \
            -f backend/sql/20260222_backtest_config_hash_idx.sql \
            -f backend/sql/20260511_broker_transactions.sql \
            -f backend/sql/20260525_broker_position_snapshots.sql \
            -f backend/sql/20260524_trident_screener.sql \
            -f backend/sql/20260525_portfolio_decision_items.sql \
            -f backend/sql/20260526_supports_targets_advice.sql \
            -f backend/sql/20260527_trident_stock_insights.sql \
            -f backend/sql/20260528_equity_screener.sql

      - name: Report skipped schema migration
        if: ${{ env.APPLY_SCHEMA != 'true' }}
        run: |
          echo "::warning::SQL migration skipped: ${SCHEMA_SKIP_REASON:-apply_schema disabled}."

      - name: Post-migration schema check
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/schema_check.py --pretty --output schema-check-after-remediation.json

      - name: Backfill top Trident prices
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/backfill_top_trident_prices.py \
            --top-n "$TOP_N" \
            --start-date "$START_DATE" \
            --output top-trident-price-backfill.json

      - name: Sync top Trident stock insights
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: |
          python scripts/sync_trident_stock_insights.py \
            --top-n "$TOP_N" \
            --batch-size "$TRIDENT_STOCK_INSIGHTS_BATCH_SIZE" \
            --force \
            --output top-trident-stock-insights.json

      - name: Sync visible Trident stock insight checks
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: |
          for ticker in GOOGL MSFT INTU NVDA; do
            python scripts/sync_trident_stock_insights.py \
              --ticker "$ticker" \
              --batch-size "$TRIDENT_STOCK_INSIGHTS_BATCH_SIZE" \
              --force \
              --output "trident-stock-insights-${ticker}.json"
          done

      - name: Sync open equity screener read model
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/sync_equity_screener.py --enforce-quality-gate --output equity-screener-sync.json

      - name: Full Trident data sync
        if: ${{ env.RUN_FULL_AFTER_TOP == 'true' }}
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REFRESH_TRIDENT_MODE: full
          TRIDENT_PRICE_SYNC_START_DATE: ${{ env.START_DATE }}
        run: |
          python scripts/run_data_refresh.py \
            --scope trident \
            --trident-mode full \
            --trident-price-start-date "$START_DATE" \
            --output refresh-report-trident-full.json

      - name: Trident freshness check
        if: always()
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/check_refresh_freshness.py --scope trident --output freshness-trident-remediation.json

      - name: Upload remediation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-data-remediation-reports
          path: |
            backend/schema-check-before-remediation.json
            backend/schema-check-after-remediation.json
            backend/top-trident-price-backfill.json
            backend/top-trident-stock-insights.json
            backend/trident-stock-insights-*.json
            backend/equity-screener-sync.json
            backend/refresh-report-trident-full.json
            backend/freshness-trident-remediation.json
          if-no-files-found: warn
