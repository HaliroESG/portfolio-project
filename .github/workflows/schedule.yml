name: Financial Data Sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Refresh scope to run"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - all
          - core
          - history
          - trident
          - backtest
      trident_mode:
        description: "Trident mode for scope=all or scope=trident"
        required: true
        type: choice
        default: daily
        options:
          - daily
          - full
      trident_price_start_date:
        description: "Optional Trident price sync start date, for example 1999-01-01 for full backfill"
        required: false
        type: string
      authorization_manifest:
        description: "Canonical JSON authorization required for mutating scopes"
        required: false
        type: string
      authorization_manifest_sha256:
        description: "SHA-256 of the canonical authorization manifest"
        required: false
        type: string
      authorization_signature:
        description: "HMAC-SHA256 signature required for mutating scopes"
        required: false
        type: string
      authorization_nonce:
        description: "One-shot lowercase hexadecimal authorization nonce"
        required: false
        type: string
      authorization_receipt_id:
        description: "One-shot authorization receipt identifier"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'validate' && 'portfolio-production-mutation' || format('financial-data-sync-validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  scheduler-heartbeat:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'validate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact scheduler SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify scheduler identity
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate fail-closed workflow contract
        run: |
          python3 .github/scripts/check_workflow_parity.py
          python3 -m unittest discover -s .github/tests -p 'test_*.py'

  prepare-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build untrusted dependency artifact without secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target "$RUNNER_TEMP/python-deps" wheel scipy==1.15.1 statsmodels==0.14.4 -r backend/requirements.txt
      - name: Upload prepared Python dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: financial-sync-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps
          if-no-files-found: error
          retention-days: 1

  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'validate' }}
    runs-on: ubuntu-latest
    needs: prepare-runtime
    timeout-minutes: 15
    environment: Production
    env:
      AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
      AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
      PYTHONPATH: ${{ runner.temp }}/python-deps
      SCOPE_INPUT: ${{ inputs.scope }}
      TRIDENT_MODE_INPUT: ${{ inputs.trident_mode }}
      TRIDENT_PRICE_START_DATE_INPUT: ${{ inputs.trident_price_start_date }}
      MUTATION_GATE: ${{ vars.ASTROCYTE_MUTATION_GATE }}
      SOURCE_RIGHTS_GATE: ${{ vars.ASTROCYTE_SOURCE_RIGHTS_GATE }}
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      trident_mode: ${{ steps.plan.outputs.trident_mode }}
      run_core: ${{ steps.plan.outputs.run_core }}
      run_history: ${{ steps.plan.outputs.run_history }}
      run_trident: ${{ steps.plan.outputs.run_trident }}
      run_backtest: ${{ steps.plan.outputs.run_backtest }}
      freshness_scope: ${{ steps.plan.outputs.freshness_scope }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Trusted verifier digest is invalid."
            exit 2
          fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Claim one-shot mutation authorization
        env:
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync \
            --replay-phase claim \
            --marker-file "$RUNNER_TEMP/mutation-replay-marker.json" \
            --input "scope=$SCOPE_INPUT" \
            --input "trident_mode=$TRIDENT_MODE_INPUT" \
            --input "trident_price_start_date=$TRIDENT_PRICE_START_DATE_INPUT"

      - name: Persist one-shot anti-replay marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-replay-${{ inputs.authorization_receipt_id }}-${{ inputs.authorization_nonce }}
          path: ${{ runner.temp }}/mutation-replay-marker.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve refresh plan
        id: plan
        run: |
          scope="${{ github.event.inputs.scope }}"
          trident_mode="${{ github.event.inputs.trident_mode }}"

          if [ -z "$scope" ]; then
            scope="validate"
          fi
          if [ -z "$trident_mode" ]; then
            trident_mode="daily"
          fi

          run_core=false
          run_history=false
          run_trident=false
          run_backtest=false
          freshness_scope="$scope"

          case "$scope" in
            all)
              run_core=true
              run_history=true
              run_trident=true
              run_backtest=true
              freshness_scope=all
              ;;
            core)
              run_core=true
              ;;
            history)
              run_history=true
              ;;
            trident)
              run_trident=true
              ;;
            backtest)
              run_backtest=true
              ;;
            validate)
              freshness_scope=all
              ;;
            *)
              echo "::error::Unsupported refresh scope: $scope"
              exit 2
              ;;
          esac

          {
            echo "scope=$scope"
            echo "trident_mode=$trident_mode"
            echo "run_core=$run_core"
            echo "run_history=$run_history"
            echo "run_trident=$run_trident"
            echo "run_backtest=$run_backtest"
            echo "freshness_scope=$freshness_scope"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved scope=$scope trident_mode=$trident_mode freshness_scope=$freshness_scope"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then
            echo "::error::Trusted verifier changed during dependency setup."
            exit 2
          fi

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync \
            --replay-phase enforce \
            --input "scope=$SCOPE_INPUT" \
            --input "trident_mode=$TRIDENT_MODE_INPUT" \
            --input "trident_price_start_date=$TRIDENT_PRICE_START_DATE_INPUT"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: financial-sync-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Verify required secrets and variables
        env:
          SCOPE: ${{ steps.plan.outputs.scope }}
          RUN_CORE: ${{ steps.plan.outputs.run_core }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GSPREAD_SERVICE_ACCOUNT: ${{ secrets.GSPREAD_SERVICE_ACCOUNT }}
          GSHEET_NAME: ${{ secrets.GSHEET_NAME }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "$RUN_CORE" = "true" ]; then
            for name in GSPREAD_SERVICE_ACCOUNT GSHEET_NAME; do
              if [ -z "${!name}" ]; then
                missing+=("$name")
              fi
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required configuration: %s\n' "${missing[*]}"
            exit 2
          fi
          echo "Configuration present for scope=$SCOPE"

      - name: Apply provider kill switches
        run: |
          if [ "$SOURCE_RIGHTS_GATE" != "APPROVED" ] || [ "$MUTATION_GATE" != "APPROVED" ]; then
            echo "::error::Provider source-rights or mutation kill switch is closed."
            exit 2
          fi

      - name: Preflight schema check
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/schema_check.py --pretty --output schema-check-preflight.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-schema-report
          path: backend/schema-check-preflight.json
          if-no-files-found: warn

  refresh-core:
    runs-on: ubuntu-latest
    environment: Production
    needs: preflight
    if: ${{ needs.preflight.outputs.run_core == 'true' }}
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ runner.temp }}/python-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then exit 2; fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify authority before mutable setup
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then exit 2; fi

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync \
            --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: financial-sync-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Refresh core feeds
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GSPREAD_SERVICE_ACCOUNT: ${{ secrets.GSPREAD_SERVICE_ACCOUNT }}
          GSHEET_NAME: ${{ secrets.GSHEET_NAME }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
        run: python scripts/run_data_refresh.py --scope core --output refresh-report-core.json

      - name: Upload core refresh report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-report-core
          path: backend/refresh-report-core.json
          if-no-files-found: warn

  refresh-market-history:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - preflight
      - refresh-core
    if: ${{ always() && needs.preflight.outputs.run_history == 'true' && needs.preflight.result == 'success' && (needs.refresh-core.result == 'success' || needs.refresh-core.result == 'skipped') }}
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ runner.temp }}/python-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then exit 2; fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify authority before mutable setup
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then exit 2; fi

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync \
            --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: financial-sync-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Refresh historical prices
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/run_data_refresh.py --scope history --output refresh-report-history.json

      - name: Upload history refresh report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-report-history
          path: backend/refresh-report-history.json
          if-no-files-found: warn

  refresh-trident:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - preflight
      - refresh-core
    if: ${{ always() && needs.preflight.outputs.run_trident == 'true' && needs.preflight.result == 'success' && (needs.refresh-core.result == 'success' || needs.refresh-core.result == 'skipped') }}
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ runner.temp }}/python-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then exit 2; fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify authority before mutable setup
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then exit 2; fi

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync \
            --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: financial-sync-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Refresh Trident screener
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REFRESH_TRIDENT_MODE: ${{ needs.preflight.outputs.trident_mode }}
          TRIDENT_PROVIDER: ${{ vars.TRIDENT_PROVIDER || 'global_yahoo' }}
          TRIDENT_INDEXES: ${{ vars.TRIDENT_INDEXES }}
          TRIDENT_LIMIT: ${{ vars.TRIDENT_LIMIT }}
          TRIDENT_PER_INDEX_LIMIT: ${{ vars.TRIDENT_PER_INDEX_LIMIT }}
          TRIDENT_YAHOO_SLEEP_SEC: ${{ vars.TRIDENT_YAHOO_SLEEP_SEC || '0.15' }}
          TRIDENT_SOURCE_LICENSE_NOTE: ${{ vars.TRIDENT_SOURCE_LICENSE_NOTE }}
          TRIDENT_PRICE_SYNC_START_DATE: ${{ github.event.inputs.trident_price_start_date || vars.TRIDENT_PRICE_SYNC_START_DATE }}
          TRIDENT_STOCK_INSIGHTS_TOP_N: ${{ vars.TRIDENT_STOCK_INSIGHTS_TOP_N || '200' }}
          TRIDENT_STOCK_INSIGHTS_BATCH_SIZE: ${{ vars.TRIDENT_STOCK_INSIGHTS_BATCH_SIZE || '25' }}
          YFINANCE_PROFILE_TIMEOUT_SEC: ${{ vars.YFINANCE_PROFILE_TIMEOUT_SEC || '30' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: |
          python scripts/run_data_refresh.py \
            --scope trident \
            --trident-mode "$REFRESH_TRIDENT_MODE" \
            --output refresh-report-trident.json

      - name: Upload Trident refresh report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-report-trident
          path: backend/refresh-report-trident.json
          if-no-files-found: warn

  refresh-backtest:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - preflight
      - refresh-core
      - refresh-market-history
    if: ${{ always() && needs.preflight.outputs.run_backtest == 'true' && needs.preflight.result == 'success' && (needs.refresh-core.result == 'success' || needs.refresh-core.result == 'skipped') && (needs.refresh-market-history.result == 'success' || needs.refresh-market-history.result == 'skipped') }}
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ runner.temp }}/python-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then exit 2; fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify authority before mutable setup
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then exit 2; fi

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync \
            --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: financial-sync-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Refresh production reference backtest
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/run_data_refresh.py --scope backtest --output refresh-report-backtest.json

      - name: Upload backtest refresh report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-report-backtest
          path: backend/refresh-report-backtest.json
          if-no-files-found: warn

  post-refresh-gate:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - preflight
      - refresh-core
      - refresh-market-history
      - refresh-trident
      - refresh-backtest
    if: ${{ always() && needs.preflight.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ runner.temp }}/python-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record trusted verifier digest before mutable setup
        id: trusted-verifier
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          digest="${digest_line%% *}"
          if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then exit 2; fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify authority before mutable setup
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify trusted verifier integrity after mutable setup
        env:
          EXPECTED_VERIFIER_SHA256: ${{ steps.trusted-verifier.outputs.sha256 }}
        shell: bash
        run: |
          digest_line=$(/usr/bin/sha256sum .github/scripts/check_mutation_contract.py)
          actual="${digest_line%% *}"
          if [ "$actual" != "$EXPECTED_VERIFIER_SHA256" ]; then exit 2; fi

      - name: Enforce one-shot authorization immediately before provider access
        env:
          AUTHORIZATION_MANIFEST: ${{ inputs.authorization_manifest }}
          AUTHORIZATION_MANIFEST_SHA256: ${{ inputs.authorization_manifest_sha256 }}
          AUTHORIZATION_SIGNATURE: ${{ inputs.authorization_signature }}
          AUTHORIZATION_HMAC_KEY: ${{ secrets.ASTROCYTE_AUTHORIZATION_HMAC_KEY }}
          AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          AUTHORIZATION_RECEIPT_ID: ${{ inputs.authorization_receipt_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S .github/scripts/check_mutation_contract.py \
            --workflow financial-data-sync --replay-phase enforce \
            --input "scope=${{ inputs.scope }}" \
            --input "trident_mode=${{ inputs.trident_mode }}" \
            --input "trident_price_start_date=${{ inputs.trident_price_start_date }}"

      - name: Download prepared dependencies after authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: financial-sync-python-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-deps

      - name: Post-refresh schema check
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/schema_check.py --pretty --output schema-check-post-refresh.json

      - name: Post-refresh freshness check
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/check_refresh_freshness.py \
            --scope "${{ needs.preflight.outputs.freshness_scope }}" \
            --output refresh-freshness-report.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Run ANON Supabase smoke
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REQUIRE_TRIDENT_ROWS: 'true'
        run: npm run smoke:supabase -- --output=smoke-supabase-report.json

      - name: Upload post-refresh reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-refresh-reports
          path: |
            backend/schema-check-post-refresh.json
            backend/refresh-freshness-report.json
            frontend/smoke-supabase-report.json
          if-no-files-found: warn
