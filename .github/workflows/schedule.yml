name: Financial Data Sync

on:
  schedule:
    - cron: '0 8 * * *'  # Exécution quotidienne à 8h UTC (une fois par jour)
  workflow_dispatch:  # Déclenchement manuel possible
  # Note: Déclencheur push supprimé pour économiser les crédits API pendant le développement

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Monorepo: Toutes les opérations Python s'exécutent dans ./backend
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          # On installe explicitement les libs scientifiques lourdes d'abord
          pip install scipy==1.15.1 statsmodels==0.14.4
          # On installe le reste via le fichier
          pip install -r requirements.txt

      - name: Sync Stock Data
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # ICI LA CORRECTION : On mappe le bon secret vers le bon nom de variable
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GSPREAD_SERVICE_ACCOUNT: ${{ secrets.GSPREAD_SERVICE_ACCOUNT }}
          GSHEET_NAME: ${{ secrets.GSHEET_NAME }}
        run: python bridge.py

      - name: Sync Macro Indicators
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python macro_sync.py

      - name: Sync News Feed
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
        run: python news_sync.py

      - name: Sync Historical Prices
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python historical_prices_sync.py

      - name: Sync Trident Screener
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TRIDENT_PROVIDER: ${{ vars.TRIDENT_PROVIDER || 'global_yahoo' }}
          TRIDENT_INDEXES: ${{ vars.TRIDENT_INDEXES }}
          TRIDENT_LIMIT: ${{ vars.TRIDENT_LIMIT }}
          TRIDENT_PER_INDEX_LIMIT: ${{ vars.TRIDENT_PER_INDEX_LIMIT }}
          TRIDENT_YAHOO_SLEEP_SEC: ${{ vars.TRIDENT_YAHOO_SLEEP_SEC || '0.15' }}
          TRIDENT_SOURCE_LICENSE_NOTE: ${{ vars.TRIDENT_SOURCE_LICENSE_NOTE }}
        run: |
          cmd=(python scripts/sync_trident_screener.py)
          if [ -n "$TRIDENT_LIMIT" ]; then
            cmd+=(--limit "$TRIDENT_LIMIT")
          fi
          if [ -n "$TRIDENT_PER_INDEX_LIMIT" ]; then
            cmd+=(--per-index-limit "$TRIDENT_PER_INDEX_LIMIT")
          fi
          "${cmd[@]}"

      - name: Generate Production Reference Backtest
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/run_backtest.py --run-name "Production Reference" --start-date 2024-01-01 --include-presets baseline

  schema-parity-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate Python runtime
        run: python --version

      - name: Run schema parity check (read-only)
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::schema-parity-check requires SUPABASE_URL and SUPABASE_SERVICE_KEY."
            exit 2
          fi
          python tools/schema_check.py --pretty --output schema-check.json

      - name: Upload schema report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-check-report
          path: backend/schema-check.json
          if-no-files-found: warn


  anon-supabase-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        working-directory: ./frontend
        run: npm ci

      - name: Run ANON Supabase smoke
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::anon-supabase-smoke requires SUPABASE_URL and SUPABASE_ANON_KEY."
            exit 2
          fi
          npm run smoke:supabase -- --output=smoke-supabase-report.json

      - name: Upload ANON smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anon-supabase-smoke-report
          path: frontend/smoke-supabase-report.json
          if-no-files-found: warn
