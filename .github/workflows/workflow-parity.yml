name: Workflow Parity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install checksum-pinned Actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_ARCHIVE_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.7_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint-v1.7.7"
          curl --fail --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" actionlint
          reported_version=$("$install_dir/actionlint" -version)
          test "${reported_version%%$'\n'*}" = "v$ACTIONLINT_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Validate every workflow with Actionlint
        run: actionlint .github/workflows/*.yml

      - name: Validate workflow inventory and fail-closed gates
        run: python3 .github/scripts/check_workflow_parity.py

      - name: Run deterministic workflow contract tests
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
