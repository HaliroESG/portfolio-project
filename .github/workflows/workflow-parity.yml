name: Workflow Parity

on:
  pull_request:
    paths:
      - ".github/scripts/check_workflow_parity.py"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/check_workflow_parity.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow inventory and fail-closed gates
        run: python3 .github/scripts/check_workflow_parity.py
